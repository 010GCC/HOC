<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HORIZONTAL OFFICE CHAIR</title>
<link rel="icon" href="favicon.ico">
<style>html,body{margin:0;background:#0a0a0a;color:#fff;font:14px monospace;height:100%;display:flex;align-items:center;justify-content:center}</style>
</head><body><div id="boot">LOADING HOC…</div>
<script>
(async () => {
  try {
    const n = 4;
    let b64 = '';
    for (let i = 0; i < n; i++) {
      const r = await fetch('payload.' + i + '.b64', { cache: 'no-store' });
      if (!r.ok) throw new Error('missing payload.' + i + '.b64');
      b64 += (await r.text()).trim();
    }
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('boot').textContent = 'Boot failed: ' + e;
  }
})();
</script></body></html>
