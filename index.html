  const REPLACEMENTS = [["<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">", "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">"], ["  html, body {\n    width: 100%; height: 100%;\n    background: #0a0a0a;\n    color: #fff;\n    font-family: 'Share Tech Mono', monospace;\n    overflow: hidden;\n    user-select: none;\n    -webkit-user-select: none;\n  }\n  body {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }", "  html, body {\n    width: 100%;\n    height: 100%;\n    height: 100dvh;\n    min-height: 100vh;\n    min-height: 100dvh;\n    background: #0a0a0a;\n    color: #fff;\n    font-family: 'Share Tech Mono', monospace;\n    overflow: hidden;\n    user-select: none;\n    -webkit-user-select: none;\n    overscroll-behavior: none;\n    touch-action: manipulation;\n    -webkit-tap-highlight-color: transparent;\n  }\n  body {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    /* No body safe-area padding — that shrank #gameContainer and left a ~40px top dead zone */\n  }"], ["  #gameContainer {\n    position: relative;\n    --gw: min(1280px, 100vw, calc(100vh * 16 / 9));\n    width: var(--gw);\n    height: calc(var(--gw) * 9 / 16);\n    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 120px rgba(0,0,0,0.5);\n  }", "  /* Fit 16:9 to viewport, then scale back 1% so chrome/edges don't clip */\n  #gameContainer {\n    position: relative;\n    --gw: min(1280px, calc(100vw * 0.99), calc(100dvh * 0.99 * 16 / 9));\n    width: var(--gw);\n    height: calc(var(--gw) * 9 / 16);\n    max-width: 99vw;\n    max-height: 99dvh;\n    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 120px rgba(0,0,0,0.5);\n  }"], ["  #touchControls {\n    position: absolute; bottom: 40px; left: 0; width: 100%; height: 165px; z-index: 8; pointer-events: none; display: none;\n  }", "  #touchControls {\n    position: absolute;\n    bottom: calc(24px + env(safe-area-inset-bottom, 0px));\n    left: 0;\n    width: 100%;\n    height: 165px;\n    z-index: 8;\n    pointer-events: none;\n    display: none;\n    padding-left: env(safe-area-inset-left, 0px);\n    padding-right: env(safe-area-inset-right, 0px);\n  }"], ["    <div id=\"portraitSub\">\n      HORIZONTAL OFFICE CHAIR<br>\n      IS DESIGNED FOR LANDSCAPE MODE<br><br>\n      Tip: disable rotation lock on your device\n    </div>\n    <button class=\"btn\" id=\"portraitPlayBtn\" style=\"font-size:12px;padding:10px 28px;margin-bottom:12px;\">PLAY IN PORTRAIT ANYWAY</button>", "    <div id=\"portraitSub\">\n      HORIZONTAL OFFICE CHAIR<br>\n      REQUIRES LANDSCAPE MODE<br><br>\n      Turn your phone sideways to play<br>\n      Tip: disable rotation lock on your device\n    </div>"], ["  #portraitOverlay.dismissed { display: none !important; }", "  /* Hard landscape lock: dismissed only hides overlay in landscape */\n  @media (orientation: landscape) {\n    #portraitOverlay.dismissed { display: none !important; }\n  }\n  @media (orientation: portrait) and (hover: none) and (pointer: coarse) {\n    #portraitOverlay.dismissed { display: flex !important; }\n  }"], ["function resizeCanvas() {\n  const container = document.getElementById('gameContainer');\n  W = container.clientWidth;\n  H = container.clientHeight;\n  canvas.width = W;\n  canvas.height = H;\n  FLOOR_Y = H - 80;\n}", "function resizeCanvas() {\n  const container = document.getElementById('gameContainer');\n  const prevFloor = FLOOR_Y;\n  const prevH = H;\n  W = Math.max(1, container.clientWidth);\n  H = Math.max(1, container.clientHeight);\n  canvas.width = W;\n  canvas.height = H;\n  // Keep a playable floor band; raise ground line ~10px vs prior (H-80 / adaptive)\n  FLOOR_Y = H - Math.max(56, Math.min(96, Math.round(H * 0.11))) - 10;\n  if (prevH > 0 && typeof PLAYER !== 'undefined') {\n    const dy = FLOOR_Y - prevFloor;\n    PLAYER.y += dy;\n    if (PLAYER.onGround) PLAYER.y = FLOOR_Y - (PLAYER.ducking ? PLAYER.h * 0.5 : PLAYER.h);\n    PLAYER.defaultX = W * 0.18;\n    PLAYER.x = Math.max(8, Math.min(PLAYER.x, W - PLAYER.w - 8));\n  }\n}"], ["window.addEventListener('resize',()=>{if(gameState==='game'){resizeCanvas();FLOOR_Y=H-80;initBgLayers();resetPlayer();}});", "function onViewportChange() {\n  resizeCanvas();\n  if (gameState === 'game') initBgLayers();\n}\nwindow.addEventListener('resize', onViewportChange);\nif (window.visualViewport) {\n  window.visualViewport.addEventListener('resize', onViewportChange);\n  window.visualViewport.addEventListener('scroll', onViewportChange);\n}"], ["window.addEventListener('orientationchange', () => {\n  setTimeout(() => { // small delay for orientation to settle\n    if (window.innerWidth > window.innerHeight) {\n      document.getElementById('portraitOverlay').classList.add('dismissed');\n    }\n  }, 300);\n});", "window.addEventListener('orientationchange', () => {\n  setTimeout(() => { // small delay for orientation to settle\n    const ov = document.getElementById('portraitOverlay');\n    if (window.innerWidth > window.innerHeight) {\n      ov.classList.add('dismissed');\n    } else {\n      ov.classList.remove('dismissed');\n    }\n    onViewportChange();\n  }, 300);\n});"], ["document.getElementById('portraitPlayBtn').addEventListener('click', () => {\n  document.getElementById('portraitOverlay').classList.add('dismissed');\n});", "/* Landscape-only: no Play Anyway soft path */"], ["HOC v1.2", "HOC v1.4"]];
  try {

    if (!res.ok) throw new Error("HTTP " + res.status);
    let html = await res.text();
    for (const [from, to] of REPLACEMENTS) {
      if (!html.includes(from)) throw new Error("Patch target missing");

    }
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
