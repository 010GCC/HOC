<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HORIZONTAL OFFICE CHAIR</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOC">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  html,body{margin:0;background:#0a0a0a;color:#fff;font-family:monospace;height:100%;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="boot">LOADING HOC…</div>
<script>
(async function () {
  const SOURCE = "https://raw.githubusercontent.com/010GCC/HOC/d35578df57508d647e1bdc9e8bd499bd8a7a83de/index.html";
  const PATCH_FILES = ["patches-0.json","patches-1.json","patches-2.json","patches-3.json"];
  try {
    const fetches = [fetch(SOURCE, { cache: "no-store" })].concat(
      PATCH_FILES.map(function (f) { return fetch(f, { cache: "no-store" }); })
    );
    const results = await Promise.all(fetches);
    const res = results[0];
    if (!res.ok) throw new Error("HTTP " + res.status);
    const patchRes = results.slice(1);
    for (let i = 0; i < patchRes.length; i++) {
      if (!patchRes[i].ok) throw new Error("Missing " + PATCH_FILES[i]);
    }
    const parts = await Promise.all(patchRes.map(function (r) { return r.json(); }));
    const REPLACEMENTS = [].concat.apply([], parts);
    let html = await res.text();
    for (const [from, to] of REPLACEMENTS) {
      if (!html.includes(from)) throw new Error("Patch target missing");
      html = html.replace(from, to);
    }
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.getElementById("boot").textContent = "Failed to load game: " + err;
  }
})();
</script>
</body>
</html>
